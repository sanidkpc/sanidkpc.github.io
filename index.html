<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test name</title>
    <link rel="stylesheet" href="https://rezve.com/css/styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul class="route">
          <li><a data-template-id="home" href="/home">Home</a></li>
          <li><a data-template-id="about" href="/about">About</a></li>
          <li><a data-template-id="blog" href="/blog">Blog</a></li>
        </ul>
      </nav>
    </header>

    <main id="content"></main>

    <template id="home">
      <h1>Welcome home</h1>
    </template>
    <template id="about">
      <h1>About Me</h1>
    </template>
    <template id="blog">
      <h1>Blog</h1>
    </template>

    <script>
      function loadRoute(path) {
        const route = document.querySelector(`a[href="${path}"]`);
        const templateId = route
          ? route.getAttribute("data-template-id")
          : null;

        if (templateId) {
          document.getElementById("content").innerHTML =
            document.getElementById(templateId).innerHTML;
        } else {
          loadRoute("/");
        }
      }

      document.addEventListener("click", (e) => {
        const link = e.target.closest("a[href^='/']");
        if (!link) return;

        e.preventDefault();
        history.pushState({}, "", link.pathname);
        loadRoute(link.pathname);
      });

      window.onpopstate = () => loadRoute(location.pathname);

      const firstLink = document.querySelector("ul.route a");
      loadRoute(firstLink ? firstLink.getAttribute("href") : "/");
    </script>
  </body>
</html>
